name: Update profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild profile graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_profile.py --user "${{ github.repository_owner }}"

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/
          git commit -m "chore: refresh profile graphics"
          # The profile API may have pushed an access-log commit meanwhile; replay on top of it.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 3))
          done
          exit 1
