name: Profile API

# Issues whose title starts with an HTTP method are requests to scripts/profile_api.py.
# Every other issue is left alone.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  respond:
    if: >-
      startsWith(github.event.issue.title, 'GET ') ||
      startsWith(github.event.issue.title, 'POST ') ||
      startsWith(github.event.issue.title, 'PUT ') ||
      startsWith(github.event.issue.title, 'PATCH ') ||
      startsWith(github.event.issue.title, 'DELETE ') ||
      startsWith(github.event.issue.title, 'HEAD ') ||
      startsWith(github.event.issue.title, 'OPTIONS ') ||
      startsWith(github.event.issue.title, 'BREW ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Answer the request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/profile_api.py
